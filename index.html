<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Seven</title>
<!-- Not security: keeps casual visitors out while the team plays it. -->
<script>while (sessionStorage.getItem('pw') !== 'sevenpenta') { if (prompt('Senha:') === 'sevenpenta') sessionStorage.setItem('pw', 'sevenpenta'); }</script>
<meta name="description" content="Seven: um ET cai no Parque Dom Bosco e entra para a equipe da gincana.">
<style>
  :root { --panel: #f4efe2; --ink: #1b1b1b; --accent: #b5452f; --btn: rgba(0,0,0,0.5); --btn-on: rgba(255,255,255,0.4); }
  @media (prefers-color-scheme: dark) { :root { --panel: #2a2622; --ink: #f4efe2; } }
  html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, sans-serif; }
  #game { width: 100dvw; height: 100dvh; }
  #game canvas { display: block; }
  .btn { position: fixed; width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: var(--btn); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .btn.on { background: var(--btn-on); }
  body.modal .btn { display: none; }
  #b-left { left: calc(16px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); }
  #b-right { left: calc(88px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); }
  /* Correr sits by Pular for the right thumb, so the left one stays on the arrows. */
  #b-run { right: calc(88px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); }
  #b-jump { right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); }
  #b-down { right: calc(16px + env(safe-area-inset-right)); bottom: calc(88px + env(safe-area-inset-bottom)); }
  #b-down[hidden] { display: none; }
  #b-grab { right: calc(88px + env(safe-area-inset-right)); bottom: calc(88px + env(safe-area-inset-bottom)); }
  #b-grab[hidden] { display: none; }
  #b-grab.ready { border-color: #f2c14e; }
  #b-pause { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: var(--btn); color: #fff; }
  #b-map { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(52px + env(safe-area-inset-right)); width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: var(--btn); color: #fff; font-size: 18px; line-height: 1; padding: 0; }
  /* Under the pause button: the top row holds pause, map and Morse; z-index over the rotate notice, since fullscreen is how a phone held upright gets turned to landscape. */
  #b-full { position: fixed; z-index: 51; top: calc(52px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: var(--btn); color: #fff; font-size: 18px; }
  #b-full[hidden] { display: none; }
  #hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #hud span { margin-right: 12px; }
  /* Every HUD line sits on a dark pill: the sky behind it ranges from night to light blue. */
  #hud-level, #hud-goal, #hud-tip { background: rgba(0,0,0,0.72); border-radius: 6px; padding: 3px 9px; width: fit-content; max-width: 60vw; text-shadow: none; }
  #hud-level { font-size: 11px; letter-spacing: 0.04em; color: #d8d8d8; }
  #hud-goal { margin-top: 4px; font-size: 14px; color: #ffd166; font-weight: 600; }
  #hud-tip { margin-top: 4px; font-size: 13px; color: #fff; }
  #hud-goal:empty, #hud-tip:empty { display: none; }
  #mark { position: fixed; transform: translate(-50%, -100%); color: #f2c14e; font: bold 22px sans-serif; background: rgba(0,0,0,0.72); border-radius: 10px; padding: 0 6px; pointer-events: none; z-index: 5; animation: bob 0.8s ease-in-out infinite alternate; }
  #mark[hidden] { display: none; }
  /* The scene pauses under a panel, so the marker would stay frozen on top of it. */
  body:has(.panel:not([hidden])) #mark { display: none; }
  @keyframes bob { to { margin-top: -8px; } }
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); }
  .panel[hidden] { display: none; }
  .sheet { background: var(--panel); color: var(--ink); border-radius: 12px; padding: 16px 20px; max-width: min(360px, 86vw); font-size: 15px; line-height: 1.35; }
  .sheet h2 { margin: 0 0 8px; font-size: 16px; }
  .sheet button { font: inherit; padding: 10px 14px; margin: 6px 6px 0 0; border-radius: 8px; border: 1px solid var(--ink); background: transparent; color: var(--ink); }
  .sheet .msg { margin: 8px 0 0; min-height: 1.3em; color: var(--accent); }
  /* Speech balloons: the narrator and Sevito (speaker id "magru", kept from the engine) speak from the left. */
  #dialog { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(36px + env(safe-area-inset-top)); max-width: min(460px, 42vw); background: var(--panel); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 16px; font-size: clamp(16px, 0.9vw + 8px, 24px); line-height: 1.3; box-shadow: 0 4px 14px rgba(0,0,0,0.5); pointer-events: none; text-shadow: none; }
  /* The narrator's box sits inside #hud, under the goal and tip lines instead of over them; no one on screen speaks it, so no tail. */
  #dialog:not(.magru):not(.oblivion) { position: relative; left: 0; top: 0; margin-top: 6px; }
  #dialog:not(.magru):not(.oblivion)::after { display: none; }
  /* The typed question covers the game: a balloon frozen under it would read as part of it. */
  body:has(#ask:not([hidden])) :is(#dialog, #talk) { display: none; }
  #dialog::after { content: ''; position: absolute; bottom: -12px; left: 24px; border: 12px solid transparent; border-bottom: 0; border-top-color: inherit; }
  #dialog.magru { transform: translate(-50%, calc(-100% - 12px)); max-width: min(320px, 40vw); background: #ffd66b; color: #3b2a1d; border-color: #b5452f; font-weight: 600; }
  #dialog.magru::after { left: calc(50% - 12px); }
  /* The Esquecimento speaks from off screen: its tail points out past the right edge. */
  #dialog.oblivion { left: auto; right: calc(24px + env(safe-area-inset-right)); top: calc(56px + env(safe-area-inset-top)); background: #111; color: #fff; border-color: #fff; font-style: italic; }
  #dialog.oblivion::after { left: auto; right: -14px; bottom: auto; top: calc(50% - 10px); border: 10px solid transparent; border-right: 0; border-left: 14px solid #fff; }
  #dialog[hidden] { display: none; }
  /* The end-of-level report: a parchment nearly the size of the caderno, torn edges, the level title as a heading and the lines as paragraphs. */
  #scores .paper { width: min(720px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); overflow: auto; touch-action: pan-y; box-sizing: border-box; padding: clamp(14px, 3vw, 32px); color: #2b2118; font-family: Georgia, 'Times New Roman', serif; text-align: center; border-radius: 4px 14px 6px 12px / 12px 4px 14px 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); background: radial-gradient(ellipse at 20% 10%, #f8efd6, #ecdcb4 55%, #d9c290); }
  #scores h2 { margin: 0 0 0.4em; font-variant: small-caps; letter-spacing: 0.04em; }
  #scores table { width: 100%; border-collapse: collapse; font-size: clamp(13px, 0.8vw + 9px, 18px); }
  #scores th, #scores td { padding: 4px 6px; border-bottom: 1px solid rgba(43,33,24,0.25); }
  #scores tr > :nth-child(2) { text-align: left; }
  #scores tr:last-child th { border-top: 2px solid rgba(43,33,24,0.5); border-bottom: 0; }
  #scores .team { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #2b2118; vertical-align: middle; }
  #scores .tap { font-size: 12px; opacity: 0.6; margin-top: 1em; }
  #b-score { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(140px + env(safe-area-inset-right)); width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: var(--btn); color: #fff; font-size: 18px; line-height: 1; padding: 0; }
  #report .paper { position: relative; width: min(920px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); overflow-y: auto; touch-action: pan-y; box-sizing: border-box; padding: clamp(18px, 4vw, 48px) clamp(20px, 6vw, 80px); color: #2b2118; font-family: Georgia, 'Times New Roman', serif; text-align: center; border-radius: 4px 14px 6px 12px / 12px 4px 14px 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 60px rgba(120,90,40,0.25); background: radial-gradient(ellipse at 20% 10%, #f8efd6, #ecdcb4 55%, #d9c290); }
  #report h2 { margin: 0 0 0.3em; font-size: clamp(22px, 2.2vw + 10px, 40px); letter-spacing: 0.04em; font-variant: small-caps; border-bottom: 2px solid rgba(43,33,24,0.35); padding-bottom: 0.3em; }
  #report p { margin: 0.6em 0; font-size: clamp(16px, 1vw + 9px, 24px); line-height: 1.5; }
  #report .cheer { font-style: italic; margin-top: 1.2em; }
  #report .tap { font-size: 12px; opacity: 0.6; margin-top: 1.5em; }
  #card .sheet { text-align: center; font-size: 17px; }
  #card .art { display: block; height: 72px; margin: 0 auto 8px; }
  #card .art[hidden] { display: none; }
  #card .tap { font-size: 12px; opacity: 0.6; margin-top: 10px; }
  /* The scripted hold: the bar fills while any key or the panel is held. */
  #hold .sheet { text-align: center; font-size: 17px; touch-action: none; }
  #hold .label { font-size: 13px; opacity: 0.75; margin: 10px 0 6px; }
  #hold .bar { height: 10px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  #hold .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  /* A rhythm: the panel sits low and clear so Sevito and the teacher dance above it; the score is one block per note on a track, with a playhead. */
  #hold.rhythm { align-items: flex-end; background: transparent; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  #hold.rhythm .sheet { width: min(760px, 94vw); max-width: none; box-sizing: border-box; padding: 10px 14px; }
  #hold.rhythm .text { margin: 0 0 6px; }
  #hold.rhythm .label { font-size: 18px; opacity: 1; font-weight: 700; margin: 4px 0 8px; }
  /* A phone on its side has no room under the feet: the score goes to the top, over the HUD (unused while dancing), clear of the dancers and of the touch buttons at the bottom. */
  @media (max-height: 500px) {
    #hold.rhythm { align-items: flex-start !important; padding-top: calc(6px + env(safe-area-inset-top)) !important; }
    #hold.rhythm .sheet { width: calc(100vw - 2 * (100px + env(safe-area-inset-right))); padding: 6px 12px; font-size: 15px; }
    #hold.rhythm .label { font-size: 16px; margin: 2px 0 4px; }
    #hold.rhythm .track { height: 30px; }
    body:has(#hold.rhythm:not([hidden])) #hud { visibility: hidden; }
  }
  #hold .track { position: relative; height: clamp(34px, 7vh, 56px); border-bottom: 3px solid var(--ink); }
  #hold .track[hidden] { display: none; }
  #hold .track b { position: absolute; bottom: 4px; height: 70%; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 6px; background: #f6efdc; transition: background 0.08s; }
  #hold .track b.on { background: var(--accent); transform: translateY(-3px); }
  #hold .track b.ok { background: #3fae4f; }
  #hold .track b.bad { background: #d3402f; }
  #hold .track i { position: absolute; top: -4px; bottom: -6px; width: 4px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
  #hold .track.extra { animation: extra 0.35s; }
  @keyframes extra { 0%, 60% { background: rgba(211,64,47,0.35); } 100% { background: transparent; } }
  /* A page-date with the map of time fills the screen as a parchment: the date on top, the map in the middle, the bar to hold at the bottom. */
  #hold.scroll { padding: 0; }
  #hold.scroll .sheet { width: 100vw; height: 100dvh; max-width: none; display: flex; flex-direction: column; box-sizing: border-box; padding: clamp(8px, 2vh, 24px) clamp(14px, 4vw, 48px); color: #2b2118; font-family: Georgia, 'Times New Roman', serif; border-radius: 0; box-shadow: inset 0 0 90px rgba(120,90,40,0.35); background: radial-gradient(ellipse at 20% 10%, #f8efd6, #ecdcb4 55%, #d9c290); --ink: #2b2118; }
  #hold.scroll .text { margin: 0; font-size: clamp(16px, 3vh + 4px, 30px); }
  #hold.scroll .label { margin: 4px 0; }
  #hold.scroll .bar { flex: none; width: min(520px, 80%); margin: 0 auto; }
  /* The map: winding roads between the places of every level, the place he is in marked in red, the ones behind him filled. */
  #hold .when { position: relative; flex: 1; min-height: 0; margin: 4px 0; }
  #hold .when[hidden] { display: none; }
  /* Opened by hand, the map has no bar to hold: the places already reached are buttons, and one more button closes it. */
  #hold.pick .bar { display: none; }
  #hold.pick .place.go { cursor: pointer; }
  #hold.pick .place.go:hover b, #hold.pick .place.go:focus b { text-decoration: underline; }
  #hold.pick .place:not(.go) { opacity: 0.45; }
  #hold .back { flex: none; align-self: center; margin: 2px auto 0; font: inherit; font-size: 15px; padding: 6px 18px; border: 2px solid var(--ink); border-radius: 6px; background: transparent; color: var(--ink); }
  #hold .back[hidden] { display: none; }
  #hold .when svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #hold .when .road { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 6; opacity: 0.45; vector-effect: non-scaling-stroke; }
  #hold .when .road.done { stroke-dasharray: none; opacity: 0.7; }
  #hold .when .place { position: absolute; transform: translate(-50%, -7px); display: flex; flex-direction: column; align-items: center; line-height: 1.1; white-space: nowrap; }
  #hold .when .place i { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; background: #f3e6c4; margin-bottom: 2px; }
  #hold .when .place.done i { background: #b9a57a; }
  #hold .when .place.now i { background: var(--accent); width: 16px; height: 16px; }
  #hold .when .place b { font-size: clamp(10px, 1.6vh + 4px, 15px); }
  #hold .when .place small { font-size: clamp(8px, 1.2vh + 3px, 12px); font-style: italic; opacity: 0.75; max-width: 16vw; overflow: hidden; text-overflow: ellipsis; }
  #hold .when .place.now b, #hold .when .place.now small { color: var(--accent); opacity: 1; }
  #hold .when .magru { position: absolute; width: 40px; height: 56px; transform: translate(-50%, -100%); z-index: 1; pointer-events: none; }
  #hold .when .magru .body { position: absolute; inset: 0; transform-origin: 20px 28px; }
  #hold .when .magru img { position: absolute; }
  #hold .when .trip { position: absolute; bottom: 0; left: 0; right: 0; margin: 0; font-size: clamp(12px, 1.6vh + 5px, 17px); font-style: italic; opacity: 0.85; text-align: center; }
  /* The caderno button sits left of the fullscreen one and blinks when something new went into the book. */
  #b-book { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(96px + env(safe-area-inset-right)); width: 36px; height: 36px; padding: 2px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: var(--btn); }
  #b-book[hidden] { display: none; }
  #b-book img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #b-book.new { animation: blink 0.9s ease-in-out infinite alternate; }
  @keyframes blink { to { border-color: #f2c14e; box-shadow: 0 0 10px #f2c14e; } }
  /* A step done: a short note at the top that fades on its own. */
  /* Bottom center, in the gap between the arrows and the action buttons, so it never covers the goal and tip lines at the top. */
  #toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(86vw, calc(100vw - 330px)); box-sizing: border-box; background: var(--panel); color: var(--ink); border: 2px solid #4f7a3a; border-radius: 12px; padding: 8px 16px; font-size: clamp(15px, 0.8vw + 8px, 20px); box-shadow: 0 4px 14px rgba(0,0,0,0.5); pointer-events: none; z-index: 30; animation: toast 2.8s ease forwards; }
  #toast[hidden] { display: none; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  /* An essential object in the foreground before it flies into the caderno. */
  #showcase { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); transition: background 0.6s; pointer-events: none; z-index: 30; }
  #showcase[hidden] { display: none; }
  #showcase.fly { background: rgba(0,0,0,0); }
  #showcase .card { display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.6s ease-in, opacity 0.6s ease-in; animation: pop 0.4s ease-out; }
  #showcase img { width: min(36vw, 36vh); height: auto; filter: drop-shadow(0 0 18px rgba(255,220,120,0.8)); }
  #showcase p { margin: 0; color: #fff; font-size: clamp(18px, 1.2vw + 10px, 30px); font-weight: 600; text-shadow: 0 2px 6px #000; }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  /* The caderno: paper stays paper in dark mode, so it uses its own colors instead of --panel. */
  #book { --paper: #f6efdc; --pen: #2b2118; --rule: rgba(70,110,160,0.16); }
  #book .paper { position: relative; width: min(920px, calc(100vw - 16px)); height: min(560px, calc(100dvh - 16px)); display: flex; flex-direction: column; box-sizing: border-box; padding: clamp(6px, 1.5vw, 16px); color: var(--pen); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,0.6); font-family: Georgia, 'Times New Roman', serif; background: repeating-linear-gradient(to bottom, transparent 0 calc(1.6em - 1px), var(--rule) calc(1.6em - 1px) 1.6em), radial-gradient(ellipse at 30% 20%, #fbf6e8, var(--paper) 60%, #e9dcbc); }
  #book .tabs { display: flex; gap: 4px; flex-wrap: wrap; padding-right: 40px; }
  #book .tabs button { font: inherit; font-size: clamp(12px, 1vw + 7px, 17px); padding: 4px 10px; border: 1px solid rgba(43,33,24,0.4); border-radius: 6px 6px 0 0; background: rgba(43,33,24,0.06); color: var(--pen); }
  #book .tabs button.on { background: rgba(181,69,47,0.15); border-color: var(--accent); font-weight: 700; }
  #book .close { position: absolute; top: clamp(4px, 1vw, 12px); right: clamp(4px, 1vw, 12px); width: 32px; height: 32px; font-size: 18px; border-radius: 50%; border: 1px solid var(--pen); background: transparent; color: var(--pen); }
  #book .cols { flex: 1; min-height: 0; display: flex; gap: clamp(6px, 1.5vw, 16px); border-top: 2px solid rgba(43,33,24,0.25); padding-top: 6px; }
  #book .list { width: 32%; max-width: 240px; margin: 0; padding: 0 6px 0 0; list-style: none; overflow-y: auto; touch-action: pan-y; border-right: 1px dashed rgba(43,33,24,0.3); font-size: clamp(12px, 0.8vw + 8px, 17px); }
  #book .list li { padding: 5px 6px; border-radius: 4px; cursor: pointer; }
  #book .list li.on { background: rgba(181,69,47,0.14); }
  #book .list li.fresh::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 6px; vertical-align: middle; border-radius: 50%; background: var(--accent); }
  #book .page { flex: 1; min-width: 0; overflow-y: auto; touch-action: pan-y; font-size: clamp(13px, 0.9vw + 9px, 19px); line-height: 1.5; padding-right: 4px; }
  #book .page h3 { margin: 0 0 6px; font-size: 1.2em; }
  #book .page p { margin: 0 0 8px; }
  #book .who { font-style: italic; opacity: 0.75; }
  #book .verse { white-space: pre-line; font-style: italic; }
  #book .item { white-space: pre-line; }
  #book .todo { margin: 0 0 4px; }
  #book .todo.crossed { text-decoration: line-through; opacity: 0.5; }
  #book .blank { opacity: 0.55; font-style: italic; margin-top: 2em; text-align: center; }
  mark.hl { background: #ffd84a; color: #6a1f00; font-weight: 800; font-family: Georgia, serif; padding: 0 1px; border-radius: 2px; }
  #book .term, .balloon .term, .memory .term { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
  /* Portraits: the character drawn faded and gray inside a pencil frame before the memory comes back, in a warm painted frame after. */
  #book .portrait { width: clamp(80px, 22vw, 180px); aspect-ratio: 3 / 4; margin: 4px 0 8px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  #book .portrait .face { width: 55%; height: 62%; border-radius: 50%; }
  #book .portrait.sketch { border: 2px dashed #8a8580; background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(120,115,110,0.12) 6px 7px); }
  #book .portrait.sketch .face { border: 2px solid #9a958f; background: #fbf8f0; }
  #book .portrait.done { border: 6px solid #a8642f; background: linear-gradient(to bottom, #8fc3dd 0 55%, #3f7fa0 55%); box-shadow: inset 0 0 0 2px #e0b062; }
  #book .portrait.done .face { background: radial-gradient(circle at 50% 40%, #e8b48a, #b97a52); border: 2px solid #5a3a22; }
  #book .portrait img { width: 80%; height: 90%; object-fit: contain; object-position: bottom; }
  #book .portrait.sketch img { filter: grayscale(1) blur(1.5px); opacity: 0.35; }
  #book .page p.now { color: var(--accent); font-weight: 600; }
  /* Conversation layer: transparent, catches the tap; the balloon hangs over the speaker's head. */
